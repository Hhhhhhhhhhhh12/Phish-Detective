name: Phish Detective - CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📂 Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: 📦 Install Project Dependencies
        run: npm ci --ignore-scripts

      - name: 🔍 TypeScript type check
        run: npm run typecheck

      - name: 🧪 Run Automated Unit Tests (Vitest)
        run: npm run test

      - name: 🛠️ Compile & Build Validation
        run: npm run build
      - name: Build static GitHub Pages version
        run: npm run build:pages

      - name: Check static artifact boundaries
        run: npm run check:pages

      - name: Install browser test engines
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Verify critical browser journeys
        run: npm run test:e2e

      - name: Retain browser test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
