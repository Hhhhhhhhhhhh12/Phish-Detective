name: Phish Detective - CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  verify:
    name: Build & Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🔍 TypeScript Typecheck & Linting
        run: npm run lint

      - name: 🧪 Run Automated Unit Tests (Vitest)
        run: npm run test

      - name: 🛠️ Compile & Build Validation
        run: npm run build
        env:
          # In CI, we use static mock/dummy values if any are strictly required
          GEMINI_API_KEY: "mock_key_for_ci_build"

      - name: Build static GitHub Pages version
        run: npm run build:pages

      - name: Check static artifact boundaries
        run: npm run check:pages
